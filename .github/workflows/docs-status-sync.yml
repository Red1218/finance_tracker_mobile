name: Documentation Status Synchronization

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-status:
    name: Verify & Sync Project Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Documentation Status Synchronizer
        id: sync
        run: node scripts/sync-doc-status.js
