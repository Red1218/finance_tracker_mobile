name: Documentation Status Synchronization

on:
  workflow_dispatch:

concurrency:
  group: docs-status-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-status:
    name: Verify & Sync Project Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Documentation Status Synchronizer
        id: sync
        run: node scripts/sync-doc-status.js

      - name: Verify Post-Sync Scope Boundary
        if: success() && steps.sync.outputs.changed == 'true'
        run: |
          node -e '
            const { execSync } = require("child_process");
            const raw = execSync("git status --porcelain=v1 -z").toString("binary");
            const items = raw.split("\0").filter(Boolean);
            const paths = new Set();
            for (const item of items) {
              if (item.length > 3) {
                paths.add(item.slice(3).trim());
              }
            }
            const pathList = Array.from(paths);
            if (pathList.length !== 1) {
              console.error(`SECURITY VIOLATION: Expected exactly 1 changed path, found ${pathList.length}:`, pathList);
              process.exit(1);
            }
            if (pathList[0] !== "docs/status/PROJECT_STATUS.md") {
              console.error(`SECURITY VIOLATION: Unexpected modified path: "${pathList[0]}"`);
              process.exit(1);
            }
            console.log("Scope boundary verified: EXACTLY ONE changed path (\x27docs/status/PROJECT_STATUS.md\x27).");
          '

      - name: Create or Update Status PR
        if: success() && steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/docs-status-sync
          base: main
          title: "docs: update living project status snapshot"
          commit-message: "docs: update living project status snapshot"
          body: |
            ## Automated Documentation Status Update

            This pull request was automatically generated by the [Documentation Status Synchronization](../../actions/workflows/docs-status-sync.yml) workflow.

            ### Verified Baseline Metrics
            - **TypeScript Static Analysis**: `${{ steps.sync.outputs.ts_errors }} errors` (`npx tsc --noEmit`)
            - **Automated Test Suite**: `${{ steps.sync.outputs.tests_passed }} / ${{ steps.sync.outputs.tests_total }} tests passing` across `${{ steps.sync.outputs.test_files }} test files` (`npx vitest run`)
            - **Expo Project Health**: `${{ steps.sync.outputs.doctor_checks }} / ${{ steps.sync.outputs.doctor_total }} checks passing` (`npx expo-doctor`)
            - **Markdown Relative Link Audit**: `${{ steps.sync.outputs.broken_links }} broken links` across `${{ steps.sync.outputs.audited_files }} documentation files`

            ### Modified File
            - `docs/status/PROJECT_STATUS.md` (Machine-owned markers ONLY)

            ---
            *Please review and merge into `main`.*
          add-paths: |
            docs/status/PROJECT_STATUS.md
          delete-branch: true
